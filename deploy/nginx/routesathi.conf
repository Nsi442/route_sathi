# RouteSathi — nginx front door
#
# Serves the built React app directly and reverse-proxies /api to gunicorn on
# localhost. The browser only ever sees one origin, so there is no CORS and no
# API hostname compiled into the frontend bundle.
#
# Install:
#   sudo cp deploy/nginx/routesathi.conf /etc/nginx/sites-available/routesathi
#   sudo ln -sf /etc/nginx/sites-available/routesathi /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

upstream routesathi_api {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain, or leave _ to answer on the public IP.
    server_name _;

    root /opt/routesathi/dist;
    index index.html;

    # Evidence photos can be a few MB; the app caps uploads at 8 MB.
    client_max_body_size 12M;

    access_log /var/log/nginx/routesathi.access.log;
    error_log  /var/log/nginx/routesathi.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://routesathi_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # The first request after a restart trains the priority model.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        proxy_buffering off;
    }

    # --- Static assets -----------------------------------------------------
    # Vite fingerprints these filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA ---------------------------------------------------------------
    # Every non-file path is a client-side route and gets index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or a deploy leaves browsers
    # asking for asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Sensible defaults; certbot adds HSTS when you enable TLS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
